<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Executivo - Diagnóstico PDV</title>
  <style>
    :root {
      --primary-color: #1a237e;
      --secondary-color: #283593;
      --accent-color: #c62828;
      --success-color: #2e7d32;
      --bg-color: #f0f2f5;
      --card-bg: #ffffff;
      --text-main: #2c3e50;
      --text-light: #546e7a;
      --border-radius: 12px;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      line-height: 1.5;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    header {
      margin-bottom: 50px;
      text-align: center;
    }

    h1 {
      color: var(--primary-color);
      font-size: 2.8rem;
      margin-bottom: 10px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .meta-info {
      color: var(--text-light);
      font-size: 1rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Navegação por Itens */
    .items-nav {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .item-card {
      background: var(--card-bg);
      padding: 25px;
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: all 0.3s ease;
      border: 3px solid transparent;
      position: relative;
    }

    .item-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
    }

    .item-card.active {
      border-color: var(--primary-color);
      background: linear-gradient(135deg, #e8eaf6 0%, #f5f5f5 100%);
    }

    .item-card h3 {
      color: var(--primary-color);
      margin: 0 0 10px 0;
      font-size: 1.3rem;
    }

    .item-card p {
      color: var(--text-light);
      font-size: 0.95rem;
      margin: 0;
    }

    .item-badge {
      position: absolute;
      top: 15px;
      right: 15px;
      background: var(--accent-color);
      color: white;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    /* KPI Section */
    .kpi-section {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 25px;
      margin-bottom: 40px;
    }

    @media (max-width: 768px) {
      .kpi-section {
        grid-template-columns: 1fr;
      }
    }

    .hero-card {
      background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
      color: white;
      padding: 40px;
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .hero-card::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 150px;
      height: 150px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 0 0 0 100%;
    }

    .hero-value {
      font-size: 5rem;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 10px;
    }

    .hero-label {
      font-size: 1.5rem;
      font-weight: 600;
      opacity: 0.9;
      text-transform: uppercase;
    }

    .hero-desc {
      margin-top: 15px;
      font-size: 1.1rem;
      opacity: 0.8;
      max-width: 80%;
    }

    .secondary-metrics {
      display: grid;
      grid-template-rows: repeat(2, 1fr);
      gap: 20px;
    }

    .metric-card {
      background: var(--card-bg);
      padding: 25px;
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-left: 5px solid var(--accent-color);
    }

    .metric-val {
      font-size: 2rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .metric-lbl {
      font-size: 0.9rem;
      color: var(--text-light);
      font-weight: 600;
      text-transform: uppercase;
    }

    .summary-card {
      background: var(--card-bg);
      padding: 30px;
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      margin-bottom: 40px;
    }

    .section-header {
      font-size: 1.25rem;
      color: var(--primary-color);
      font-weight: 700;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 2px solid #eee;
      padding-bottom: 10px;
    }

    .context-text {
      font-size: 1.1rem;
      margin-bottom: 30px;
      color: #444;
    }

    .root-causes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }

    .cause-item {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
    }

    .cause-pilar {
      color: var(--accent-color);
      font-weight: 700;
      font-size: 0.9rem;
      text-transform: uppercase;
      margin-bottom: 5px;
      display: block;
    }

    .accordion {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 40px;
    }

    .acc-item {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .acc-header {
      padding: 20px 25px;
      background: white;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.2s;
    }

    .acc-header:hover {
      background: #f8f9fa;
    }

    .acc-title {
      font-size: 1.1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .percent-badge {
      background: var(--primary-color);
      color: white;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .acc-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease-out;
      background: #fafafa;
      border-top: 1px solid #eee;
    }

    .acc-body {
      padding: 25px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }

    @media (max-width: 768px) {
      .acc-body {
        grid-template-columns: 1fr;
      }
    }

    .analysis-box h4 {
      color: var(--secondary-color);
      margin-top: 0;
      font-size: 1rem;
    }

    .recommendation-box {
      background: #e8f5e9;
      padding: 15px;
      border-radius: 8px;
      color: #1b5e20;
      margin-top: 15px;
    }

    .examples-list {
      background: white;
      border: 1px solid #ddd;
      padding: 15px;
      border-radius: 8px;
      font-size: 0.9rem;
      color: #666;
      font-style: italic;
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 8px;
      overflow: hidden;
    }

    th,
    td {
      padding: 15px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }

    th {
      background: var(--primary-color);
      color: white;
      font-weight: 600;
    }

    .plan-meta {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      background: #e3f2fd;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .meta-item strong {
      display: block;
      color: var(--primary-color);
      font-size: 0.85rem;
      text-transform: uppercase;
    }
  </style>
</head>

<body>

  <div class="container">
    <header>
      <h1 id="page-title">Carregando...</h1>

    <div id="dynamic-content"></div>

              {

    let currentItemIndex = 0;

    function renderDashboard(report) {
      if (!report || !report.meta) return;

      document.getElementById('page-title').textContent = report.meta.titulo;
      document.getElementById('total-casos').textContent = report.meta.total_casos;
      document.getElementById('analysis-date').textContent = report.meta.data_analise || new Date().toLocaleDateString();

      const navContainer = document.getElementById('items-nav');
      navContainer.innerHTML = '';

      report.itens.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = `item-card ${index === 0 ? 'active' : ''}`;
        card.onclick = () => switchItem(index);
        card.innerHTML = `
                    <span class="item-badge">${item.badge}</span>
                    <h3>${item.titulo}</h3>
                    <p>${item.descricao}</p>
                `;
        navContainer.appendChild(card);
      });

      renderItemContent(report.itens[0], 0);
    }

    function switchItem(index) {
      currentItemIndex = index;

      document.querySelectorAll('.item-card').forEach((card, i) => {
        card.classList.toggle('active', i === index);
      });

      renderItemContent(data.itens[index], index);
    }

    function renderItemContent(item, index) {
      const contentContainer = document.getElementById('dynamic-content');

      let kpiHTML = '<div class="kpi-section">';

      if (item.one_pager.quantificacao.length > 0) {
        const hero = item.one_pager.quantificacao[0];
        kpiHTML += `
                    <div class="hero-card">
                        <span class="hero-label">${hero.metrica}</span>
                        <span class="hero-value">${hero.valor}</span>
                        <span class="hero-desc">${hero.descricao}</span>
                    </div>
                `;

        kpiHTML += '<div class="secondary-metrics">';
        for (let i = 1; i < item.one_pager.quantificacao.length; i++) {
          kpiHTML += `
                        <div class="metric-card">
                            <span class="metric-val">${item.one_pager.quantificacao[i].valor}</span>
                            <span class="metric-lbl">${item.one_pager.quantificacao[i].metrica}</span>
                            <small style="color: #777; margin-top: 5px;">${item.one_pager.quantificacao[i].descricao}</small>
                        </div>
                    `;
        }
        kpiHTML += '</div>';
      }
      kpiHTML += '</div>';

      let causesHTML = '';
      item.one_pager.causa_raiz_macro.forEach(cause => {
        causesHTML += `
                    <div class="cause-item">
                        <span class="cause-pilar">${cause.pilar}</span>
                        ${cause.descricao}
                    </div>
                `;
      });

      let accordionHTML = '';
      item.detalhamento_casos.forEach((caso) => {
        const examples = caso.exemplos_reais.map(ex => `<li>"${ex}"</li>`).join('');
        accordionHTML += `
                    <div class="acc-item">
                        <div class="acc-header" onclick="toggleAcc(this)">
                            <div class="acc-title">
                                <span class="percent-badge">${caso.percentual}</span>
                                ${caso.categoria}
                            </div>
                            <span>▼</span>
                        </div>
                        <div class="acc-content">
                            <div class="acc-body">
                                <div class="analysis-box">
                                    <h4>Análise Técnica & Contexto</h4>
                                    <p>${caso.resumo_problema}</p>
                                    <p><strong>Causa Raiz Específica:</strong> ${caso.analise_tecnica}</p>
                                    
                                    <div class="recommendation-box">
                                        <strong>💡 Ação Imediata / Workaround:</strong><br>
                                        ${caso.acao_imediata}
                                    </div>
                                </div>
                                <div class="examples-box">
                                    <h4>Exemplos Reais (Logs)</h4>
                                    <ul class="examples-list" style="list-style-type: none; padding: 0;">
                                        ${examples}
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
      });

      let actionsHTML = '';
      item.plano_acao.acoes.forEach(acao => {
        actionsHTML += `
                    <tr>
                        <td>${acao.passo}</td>
                        <td>${acao.responsavel}</td>
                        <td>${acao.prazo}</td>
                    </tr>
                `;
      });

      contentContainer.innerHTML = `
                ${kpiHTML}

                <div class="summary-card">
                    <div class="section-header">📋 Diagnóstico Executivo</div>
                    <p class="context-text">${item.one_pager.contexto}</p>

                    <div class="section-header" style="font-size: 1.1rem; margin-top: 30px;">🔍 Causas Raiz Macro</div>
                    <div class="root-causes-grid">
                        ${causesHTML}
                    </div>
                </div>

                <h2 class="section-header">📉 Detalhamento dos Principais Agravantes</h2>
                <p style="margin-bottom: 20px; color: #666;">Clique nas categorias abaixo para expandir a análise técnica, recomendações e exemplos reais.</p>

                <div class="accordion">
                    ${accordionHTML}
                </div>

                <div class="summary-card">
                    <div class="section-header">🚀 Plano de Ação Estratégico</div>

                    <div class="plan-meta">
                        <div class="meta-item"><strong>Projeto</strong> <span>${item.plano_acao.nome_projeto}</span></div>
                        <div class="meta-item"><strong>Objetivo</strong> <span>${item.plano_acao.objetivo}</span></div>
                        <div class="meta-item"><strong>Esforço</strong> <span>${item.plano_acao.esforco}</span></div>
                        <div class="meta-item"><strong>Dependências</strong> <span>${item.plano_acao.dependencias || 'N/A'}</span></div>
                    </div>

                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Ação</th>
                                    <th>Responsável</th>
                                    <th>Prazo</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${actionsHTML}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;

      setTimeout(() => {
        const firstHeader = contentContainer.querySelector('.acc-header');
        if (firstHeader) toggleAcc(firstHeader);
      }, 100);
    }

    function toggleAcc(el) {
      const content = el.nextElementSibling;

      document.querySelectorAll('.acc-content').forEach(div => {
        if (div !== content) {
          div.style.maxHeight = null;
          div.previousElementSibling.querySelector('span:last-child').textContent = '▼';
        }
      });

      if (content.style.maxHeight) {
        content.style.maxHeight = null;
        el.querySelector('span:last-child').textContent = '▼';
      } else {
        content.style.maxHeight = content.scrollHeight + "px";
        el.querySelector('span:last-child').textContent = '▲';
      }
    }

    if (data && data.itens && data.itens.length > 0) {
      renderDashboard(data);
    }
  </script>
